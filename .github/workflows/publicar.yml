# ═══════════════════════════════════════════════════════════════════════════
#  CANDADO DE PUBLICACION (24-set-2026)
#  Cada git push a main: 1) corre la prueba automatica del sistema en un
#  navegador real (red simulada, no escribe datos reales); 2) SOLO si sale
#  "TODO OK" publica en GitHub Pages. Si falla, NO publica: los usuarios siguen
#  con la version anterior y GitHub te envia un correo con el detalle.
#  Requisito (una vez): Settings -> Pages -> Source: "GitHub Actions".
# ═══════════════════════════════════════════════════════════════════════════
name: Probar y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  probar:
    name: Prueba automatica del sistema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar navegador de prueba
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Correr prueba (Dashboard, Horas, Inventario, Calculo, Login)
        run: python tools/prueba_sistema.py .

  publicar:
    name: Publicar en GitHub Pages
    needs: probar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # _ACTUALIZAR_V3 (15-oct-2026): version.json se genera solo en cada publicacion
      # (version = commit corto, fecha de Lima, titulo = mensaje del commit). Las pantallas
      # lo consultan cada 3 min y avisan / actualizan solas (frontend/js/actualizar.js).
      - name: Generar version.json
        run: |
          python3 - <<'EOF'
          import json, subprocess, datetime, os
          sha = os.environ.get('GITHUB_SHA', '')[:7] or 'local'
          try: msg = subprocess.check_output(['git', 'log', '-1', '--pretty=%s']).decode('utf-8', 'ignore').strip()
          except Exception: msg = ''
          fecha = (datetime.datetime.utcnow() - datetime.timedelta(hours=5)).strftime('%d/%m/%Y %H:%M')
          json.dump({'version': sha, 'fecha': fecha, 'titulo': msg[:140], 'notas': ''}, open('version.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print(open('version.json', encoding='utf-8').read())
          EOF
      - name: Armar el sitio (mismos archivos que publicaba GitHub Pages)
        run: |
          mkdir _site
          rsync -a --exclude='.*' --exclude='_*' --exclude='node_modules' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
